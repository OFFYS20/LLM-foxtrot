[project]
name = "foxtrot-backend"
version = "0.1.0"
description = "Foxtrot — local LLM experimentation, training, evaluation and chat platform"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Apache-2.0" }

dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0,<3.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "psutil>=5.9",
  "PyYAML>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12.535"]
training = ["torch>=2.3", "transformers>=4.44", "datasets>=2.20", "accelerate>=0.33", "peft>=0.12", "safetensors>=0.4"]
data = ["pyarrow>=16.0", "pandas>=2.2"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Bundled benchmark item pools are data tables; long rows stay readable as-is.
"app/services/evaluation/samples.py" = ["E501"]
"app/services/demo/seed.py" = ["E501"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
