[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-studio"
version = "0.1.0"
description = "A local laboratory for creating, training, fine-tuning, evaluating and chatting with language models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["llm", "training", "fine-tuning", "lora", "rag", "transformers", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "tokenizers>=0.19",
    "datasets>=2.18",
    "accelerate>=0.29",
    "peft>=0.10",
    "safetensors>=0.4",
    "sentence-transformers>=2.7",
    "faiss-cpu>=1.8",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "EbookLib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "nvidia-ml-py>=12.535",
    "gradio>=5.0",
]

[project.optional-dependencies]
# Requires a CUDA GPU; the app refuses quantized runs when it is missing.
quantization = ["bitsandbytes>=0.43"]
dev = ["pytest>=8.0"]

[project.scripts]
ai-studio = "ai_studio.app:main"

[project.urls]
Repository = "https://github.com/offys20/llm-foxtrot"

[tool.setuptools.packages.find]
where = [".."]
include = ["ai_studio*"]

[tool.setuptools.package-data]
ai_studio = ["config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
